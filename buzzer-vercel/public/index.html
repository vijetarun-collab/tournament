<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Buzzer Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Buzzer Round</h1></div>
    <button id="sound" class="ghost" type="button" aria-pressed="true">Sound on</button>
  </header>

  <div id="status" class="status" data-s="idle" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting&hellip;</span></div>

  <p id="note" class="note" role="alert" hidden></p>

  <section id="play">
    <div id="picker">
      <h2>Which team is this phone?</h2>
      <p class="hint" style="margin:6px 0 14px">Pick once. This phone stays on that team.</p>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>

    <div id="stage" hidden>
      <div class="teamstrip">
        <span class="swatch" id="mySwatch"></span>
        <strong id="myName"></strong>
        <button id="change" class="link" type="button">Change team</button>
      </div>
      <button id="buzz" class="buzz" type="button" data-k="wait" disabled>
        <span class="buzz-main" id="buzzMain">WAIT</span>
        <span class="buzz-sub" id="buzzSub">No question yet</span>
      </button>
    </div>

    <h2>Scores</h2>
    <ol class="board" id="board"></ol>
  </section>
</div>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
